<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen flex flex-col">
    <header>
        <nav class="bg-white shadow-sm">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
    <a href="#" class="text-xl font-bold text-orange-600">Auchan</a>
    <button type="button" class="rounded-md p-2 text-gray-700 md:hidden" aria-label="Ouvrir le menu">
      ☰
    </button>
    <ul class="hidden items-center gap-6 md:flex">
      <li><a href="#" class="text-gray-700 hover:text-orange-600">Accueil</a></li>
      <li><a href="#catalogue" class="text-gray-700 hover:text-orange-600">Catalogue</a></li>
      <li><a href="#panier" class="text-gray-700 hover:text-orange-600">Panier</a></li>
    </ul>
    <button id="openPanier" class="border bg-red-300 text-white rounded-md" id="openPanier">panier</button>
  </div>
  <select id="cataloge">
    <option value="">Toutes les catégories</option>
    <option value="Produits laitiers">Produits laitiers</option>
    <option value="Boissons">Boissons</option>
    <option value="Épicerie">Épicerie</option>
    <option value="Fruits et légumes">Fruits et légumes</option>
    <option value="Viandes et poissons">Viandes et poissons</option>
    <option value="Entretien">Entretien</option>
    <option value="Hygiène">Hygiène</option>
</select>
<input type="text" placeholder="Entrer le nom de produit" name="" id="NameRecherche">
</nav>
    </header>
    <main class="flex-1">
  <section id="catalogue-products" class="grid grid-cols-1 gap-4 p-4 sm:grid-cols-2 lg:grid-cols-4">
    <h1>Catalogue</h1>
    <div class="flex justify-between">
      <button id="scrol-back">back</button>
      <p class="border" id="number-page">1</p>
      <button id="scrol-next">next</button>
    </div>
  </section>

  

  <dialog id="panier" class="w-11/12 max-w-lg rounded-xl p-0 shadow-xl backdrop:bg-black/50">
    <div class="flex items-center justify-between border-b p-5">
      <h2 class="text-xl font-bold">Mon panier</h2>
      <button id="ClosePanier" type="button" class="rounded px-3 py-1 text-2xl" aria-label="Fermer">&times;</button>
    </div>
    <div id="cart-items" class="max-h-96 space-y-3 overflow-y-auto p-5"></div>
    <div class="flex items-center justify-between border-t p-5">
      <strong>Total :</strong><strong id="cart-total">0</strong>
    </div>
  </dialog>
    </main>
    <footer class="bg-black px-4 py-6 text-center text-sm text-white">
            
        <p>© 2026 Auchan - tous droits réservés.</p>
        <div class="mt-3 flex justify-center gap-5">
            <a href="index.html" class="hover:text-orange-400">Acceil</a>
            <a href="" class="hover:text-orange-400">Cataloge</a>
           <a href="" class="hover:text-orange-400">Panier</a>

        </div>

    </footer>
</body>
      <script type="module" src="./js/main.js"></script>
</html>
